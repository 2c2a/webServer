[project]
name = "2c2a"
version = "2.0.0"
description = "2c2a - FastAPI + Huey Cloud Computer Management Platform"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "huey>=2.5.2",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.4",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
    "markdown>=3.7",
    "pywinrm>=0.4.3",
    "idna>=3.10",
    "toml>=0.10.2",
]

[project.optional-dependencies]
kerberos = [
    "gssapi>=1.11.1",
    "krb5>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
