[project]
name = "2c2a"
version = "1.0.0"
description = "2c2a - Django Web Application"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "celery==5.4.0",
    "cryptography==46.0.3",
    "django-cors-headers==4.3.1",
    "django-formtools>=2.5.1",
    "Django==4.2.27",
    "djangorestframework==3.15.2",
    "idna==3.15",
    "kombu==5.6.2",
    "Markdown==3.10.1",
    "pillow==12.1.0",
    "PyJWT>=2.8.0",
    "pyotp",
    "python-dotenv==1.2.2",
    "pywinrm==0.4.3",
    "redis>=5.0.0",
    "requests==2.32.3",
    "toml",
    "django-cotton @ git+https://github.com/2c2a/django-cotton.git@feature/x-prefix-tag-support",
    "djlint>=1.36.4",
    "heroicons>=2.14.0",
    "cotton-icons>=0.2.0",
    "whitenoise>=6.12.0",
    "django-tianai-captcha",
]

[project.optional-dependencies]
kerberos = [
    "gssapi>=1.11.1",
    "krb5>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django",
    "black",
    "django-stubs>=6.0.2",
    "flake8",
    "pyrefly>=0.60.0",
    "pytest",
    "pytest-django",
    "redis>=7.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pyrefly]
python-version = "3.13"

[tool.uv.sources]
django-tianai-captcha = { git = "https://github.com/trustedinster/django-tianai-captcha.git" }
