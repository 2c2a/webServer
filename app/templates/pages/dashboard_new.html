{% extends "frontend_shell.html" %}
{% set active_nav = "dashboard" %}
{% set page_title = "仪表盘" %}

{% block content %}

        <!-- 1. Welcome Section -->
        <div hx-get="/fragments/dashboard/welcome"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- 2. Site Announcement Card -->
        <div hx-get="/fragments/dashboard/announcement"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- 3. Stats Row -->
        <div hx-get="/fragments/dashboard/stats"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- 4. My Cloud Computers Section -->
        <div style="padding: 12px 0 0;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px 10px;">
                <h2 style="font-size: 16px; font-weight: 600; color: var(--c-text-primary); margin: 0;"
                    data-dom-id="nav-cloud-computers">我的云电脑</h2>
                <a href="/cloud-computers" style="font-size: 12px; color: var(--c-brand); text-decoration: none;">查看全部</a>
            </div>
            <div hx-get="/fragments/dashboard/cloud-computers"
                 hx-trigger="load"
                 hx-target="this"
                 hx-swap="innerHTML">
                <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
            </div>
        </div>

        <!-- 5. Points Balance Card -->
        <div style="padding: 12px 16px;"
             hx-get="/fragments/dashboard/points"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- 6. Quick Actions Row -->
        <div style="padding: 4px 16px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <a href="/points" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 8px; background: #ffffff; border: 1px solid var(--c-brand); border-radius: 8px; cursor: pointer; font-family: inherit; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="#4b3fe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                <span style="font-size: 13px; color: var(--c-brand); font-weight: 500;">积分</span>
            </a>
            <a href="/tickets/new" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 8px; background: #ffffff; border: 1px solid var(--c-brand); border-radius: 8px; cursor: pointer; font-family: inherit; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="#4b3fe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
                <span style="font-size: 13px; color: var(--c-brand); font-weight: 500;">提工单</span>
            </a>
            <a href="/cloud-computers" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 8px; background: #ffffff; border: 1px solid var(--c-brand); border-radius: 8px; cursor: pointer; font-family: inherit; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="#4b3fe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>
                </svg>
                <span style="font-size: 13px; color: var(--c-brand); font-weight: 500;">云电脑</span>
            </a>
        </div>

{% endblock %}
