{% extends "frontend_shell.html" %}
{% set active_nav = "profile" %}
{% set page_title = "我的" %}

{% block content %}

        <!-- 1. User Profile Card -->
        <div style="padding: 16px;"
             hx-get="/fragments/profile/detail"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- 2. Account Management Section -->
        <div style="padding: 0 16px;">
            <div style="background: var(--c-bg); border-radius: 12px; overflow: hidden;">
                <p style="font-size: 13px; font-weight: 500; color: var(--c-text-tertiary); padding: 16px 16px 8px; margin: 0;">账号管理</p>

                <!-- Change Password -->
                <a href="/profile/change-password"
                   style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; text-decoration: none; border-bottom: 1px solid var(--c-border); transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-bg-secondary)'" onmouseleave="this.style.background='transparent'">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="color: var(--c-text-secondary); flex-shrink: 0;">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <span style="font-size: 14px; color: var(--c-text-primary);">修改密码</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="color: var(--c-text-tertiary); flex-shrink: 0;">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>

                <!-- Email Management -->
                <a href="/profile/email-manage"
                   style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; text-decoration: none; border-bottom: 1px solid var(--c-border); transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-bg-secondary)'" onmouseleave="this.style.background='transparent'">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="color: var(--c-text-secondary); flex-shrink: 0;">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <span style="font-size: 14px; color: var(--c-text-primary);">邮箱管理</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="color: var(--c-text-tertiary); flex-shrink: 0;">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>

                <!-- Phone Management -->
                <a href="#"
                   style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; text-decoration: none; transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-bg-secondary)'" onmouseleave="this.style.background='transparent'">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="color: var(--c-text-secondary); flex-shrink: 0;">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        <span style="font-size: 14px; color: var(--c-text-primary);">手机号管理</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="color: var(--c-text-tertiary); flex-shrink: 0;">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- 3. Points Section -->
        <div style="padding: 12px 16px 0;">
            <div style="background: var(--c-bg); border-radius: 12px; overflow: hidden;">
                <!-- Points Detail -->
                <a href="/points"
                   style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; text-decoration: none; transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-bg-secondary)'" onmouseleave="this.style.background='transparent'">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="color: var(--c-text-secondary); flex-shrink: 0;">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span style="font-size: 14px; color: var(--c-text-primary);">积分明细</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="color: var(--c-text-tertiary); flex-shrink: 0;">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- 4. About Section -->
        <div style="padding: 12px 16px 0;">
            <div style="background: var(--c-bg); border-radius: 12px; overflow: hidden;">
                <!-- About Us -->
                <a href="/about"
                   style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; text-decoration: none; border-bottom: 1px solid var(--c-border); transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-bg-secondary)'" onmouseleave="this.style.background='transparent'">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="color: var(--c-text-secondary); flex-shrink: 0;">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4"/>
                            <path d="M12 8h.01"/>
                        </svg>
                        <span style="font-size: 14px; color: var(--c-text-primary);">关于我们</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="color: var(--c-text-tertiary); flex-shrink: 0;">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>

                <!-- Logout -->
                <a href="javascript:void(0)" onclick="handleLogout()"
                   style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; text-decoration: none; transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-bg-secondary)'" onmouseleave="this.style.background='transparent'">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="color: var(--c-error); flex-shrink: 0;">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" x2="9" y1="12" y2="12"/>
                        </svg>
                        <span style="font-size: 14px; color: var(--c-error);">退出登录</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="color: var(--c-text-tertiary); flex-shrink: 0;">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- 5. App Version -->
        <div style="text-align: center; padding-top: 24px; padding-bottom: 80px;">
            <span style="font-size: 12px; color: var(--c-text-tertiary);">v1.0.0</span>
        </div>

{% endblock %}

{% block scripts %}
<!-- auth.js 提供 logout() / window.__ACCESS_TOKEN__ 等认证辅助函数 -->
<script src="/static/js/auth.js"></script>
<script>
// 退出登录：先调用 /auth/logout 清除 Refresh Cookie，再清空内存 Access Token，跳转登录页
async function handleLogout() {
    try {
        await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
    } catch (e) {
        // 即使请求失败也继续清空本地状态并跳转
        console.error('logout request failed', e);
    }
    window.__ACCESS_TOKEN__ = null;
    location.href = '/login';
}
</script>
{% endblock %}
