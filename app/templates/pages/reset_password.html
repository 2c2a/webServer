<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>设置新密码</title>
    <style id="theme-vars">
:root{--c-brand:#4b3fe3;--c-brand-hover:#6a6fff;--c-brand-active:#3f31c6;--c-brand-disabled:rgba(75,63,227,0.22);--c-brand-soft:rgba(170,183,255,0.36);--c-bg:#ffffff;--c-bg-secondary:#f5f5f5;--c-bg-tertiary:#e5e5e5;--c-text-primary:#171717;--c-text-default:#262626;--c-text-secondary:#404040;--c-text-tertiary:#737373;--c-border:rgba(115,115,115,0.12);--c-success:#00b983;--c-warning:#f2a90c;--c-error:#ff4757;--c-info:#3f85ff}
    </style>
    <script src="/static/vendor/tailwind-browser.min.js"></script>
    <script src="/static/vendor/lucide.min.js"></script>
    <style>
      @keyframes auth-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .auth-anim { opacity: 0; animation: auth-fade-up 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
      .auth-anim-1 { animation-delay: 0.02s; }
      .auth-anim-2 { animation-delay: 0.08s; }
      .auth-anim-3 { animation-delay: 0.14s; }
      .auth-anim-4 { animation-delay: 0.20s; }
      .auth-anim-5 { animation-delay: 0.26s; }
      @media (prefers-reduced-motion: reduce) {
        .auth-anim { opacity: 1; animation: none; }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--c-bg-secondary); font-family: 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;">
    <main class="min-h-screen flex items-end sm:items-center sm:justify-center">
        <div class="w-full max-w-md bg-white rounded-t-3xl sm:rounded-2xl px-6 pt-6 pb-8 mx-auto sm:shadow-sm" style="border-top: 1px solid var(--c-border);">

            <!-- Back to login -->
            <a href="/login" class="auth-anim auth-anim-1"
               style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--c-text-tertiary); text-decoration: none; margin-bottom: 16px; transition: color 0.15s;"
               onmouseenter="this.style.color='var(--c-brand)'"
               onmouseleave="this.style.color='var(--c-text-tertiary)'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                返回登录
            </a>

            <!-- ============ Step A: 设置新密码（邮件链接进入） ============ -->
            <div id="step-reset">
                <!-- Icon -->
                <div class="auth-anim auth-anim-1" style="width: 52px; height: 52px; border-radius: 14px; background: rgba(170,183,255,0.18); display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                    </svg>
                </div>

                <h1 class="auth-anim auth-anim-2" style="font-size: 22px; font-weight: 600; color: var(--c-text-primary); margin: 0 0 6px; font-family: 'SF Pro', 'PingFang SC', system-ui, sans-serif;">设置新密码</h1>
                <p class="auth-anim auth-anim-2" style="font-size: 14px; color: var(--c-text-secondary); margin: 0 0 20px; line-height: 1.5;">请输入您的新密码，重置后需使用新密码登录。</p>

                <!-- 错误提示（token 无效时显示，并隐藏表单） -->
                <div id="token-error" style="display: none; background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.3); border-radius: 8px; padding: 14px; margin-bottom: 16px;">
                    <div style="display: flex; align-items: flex-start; gap: 8px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--c-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                        <div>
                            <p style="margin:0 0 4px;font-size:13px;font-weight:500;color:var(--c-error);">重置链接无效</p>
                            <p id="token-error-msg" style="margin:0;font-size:12px;color:var(--c-text-secondary);line-height:1.5;">该链接可能已过期或已使用，请重新申请密码重置。</p>
                        </div>
                    </div>
                    <a href="/forgot-password" style="display:block;margin-top:12px;text-align:center;font-size:13px;color:var(--c-brand);text-decoration:none;font-weight:500;">重新申请密码重置</a>
                </div>

                <form id="reset-form" autocomplete="off" class="auth-anim auth-anim-3">
                    <!-- New Password -->
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--c-text-secondary); margin-bottom: 6px;">新密码</label>
                        <div style="position: relative;">
                            <input
                                id="input-new-pw"
                                type="password"
                                placeholder="请输入新密码（至少 8 位）"
                                autocomplete="new-password"
                                style="width: 100%; height: 44px; border: 1px solid var(--c-border); border-radius: 8px; padding: 0 40px 0 12px; font-size: 14px; color: var(--c-text-primary); background: #fff; outline: none; font-family: inherit; box-sizing: border-box; transition: border-color 0.15s;"
                                onfocus="this.style.borderColor='var(--c-brand)'"
                                onblur="this.style.borderColor='var(--c-border)'"
                                oninput="checkStrength()"
                            />
                            <button type="button" onclick="togglePw('input-new-pw','eye-new')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 6px; color: var(--c-text-tertiary); display: flex; align-items: center; justify-content: center;" aria-label="显示密码">
                                <svg id="eye-new" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <!-- Strength Indicator -->
                        <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px;">
                            <div style="flex: 1; height: 3px; background: var(--c-bg-tertiary); border-radius: 2px; overflow: hidden;">
                                <div id="str-bar" style="width: 0%; height: 100%; border-radius: 2px; transition: all 0.3s;"></div>
                            </div>
                            <span id="str-text" style="font-size: 11px; color: var(--c-text-tertiary); white-space: nowrap;">密码强度</span>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--c-text-secondary); margin-bottom: 6px;">确认密码</label>
                        <div style="position: relative;">
                            <input
                                id="input-confirm-pw"
                                type="password"
                                placeholder="请再次输入新密码"
                                autocomplete="new-password"
                                style="width: 100%; height: 44px; border: 1px solid var(--c-border); border-radius: 8px; padding: 0 40px 0 12px; font-size: 14px; color: var(--c-text-primary); background: #fff; outline: none; font-family: inherit; box-sizing: border-box; transition: border-color 0.15s;"
                                onfocus="this.style.borderColor='var(--c-brand)'"
                                onblur="this.style.borderColor='var(--c-border)'"
                                oninput="checkMatch()"
                            />
                            <button type="button" onclick="togglePw('input-confirm-pw','eye-confirm')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 6px; color: var(--c-text-tertiary); display: flex; align-items: center; justify-content: center;" aria-label="显示密码">
                                <svg id="eye-confirm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div id="match-hint" style="margin-top: 6px; display: none; align-items: center; gap: 4px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            <span style="font-size: 12px;">密码一致</span>
                        </div>
                        <div id="mismatch-hint" style="margin-top: 6px; display: none; align-items: center; gap: 4px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                            <span style="font-size: 12px;">两次密码不一致</span>
                        </div>
                    </div>

                    <!-- 密码要求 -->
                    <div style="background: var(--c-bg-secondary); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;">
                        <p style="font-size: 12px; font-weight: 500; color: var(--c-text-secondary); margin: 0 0 8px;">密码要求</p>
                        <div style="display: flex; flex-direction: column; gap: 6px;">
                            <div id="rule-len" style="display: flex; align-items: center; gap: 6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
                                <span style="font-size: 12px; color: var(--c-text-tertiary);">至少 8 个字符</span>
                            </div>
                            <div id="rule-upper" style="display: flex; align-items: center; gap: 6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
                                <span style="font-size: 12px; color: var(--c-text-tertiary);">包含大写字母</span>
                            </div>
                            <div id="rule-num" style="display: flex; align-items: center; gap: 6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
                                <span style="font-size: 12px; color: var(--c-text-tertiary);">包含数字</span>
                            </div>
                            <div id="rule-special" style="display: flex; align-items: center; gap: 6px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
                                <span style="font-size: 12px; color: var(--c-text-tertiary);">包含特殊字符（!@#$%...）</span>
                            </div>
                        </div>
                    </div>

                    <!-- 错误提示 -->
                    <p id="reset-error" class="text-xs text-center" style="color: var(--c-error); min-height: 16px; margin: 0 0 4px;"></p>

                    <!-- Submit -->
                    <button
                        type="submit"
                        id="btn-reset"
                        disabled
                        style="width: 100%; height: 44px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--c-bg); cursor: not-allowed; font-family: inherit; transition: all 0.2s; background: var(--c-brand-disabled); opacity: 0.6;"
                    >确认重置</button>
                </form>
            </div>

            <!-- ============ Step B: 重置成功 ============ -->
            <div id="step-success" style="display: none; text-align: center; padding: 16px 0 4px;">
                <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(0,185,131,0.12); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <p style="font-size: 16px; font-weight: 600; color: var(--c-text-primary); margin: 0 0 8px;">密码重置成功</p>
                <p style="font-size: 14px; color: var(--c-text-secondary); margin: 0 0 6px; line-height: 1.5;">您的密码已更新，所有现有会话已失效。</p>
                <p style="font-size: 13px; color: var(--c-text-tertiary); margin: 0 0 20px; line-height: 1.5;">请使用新密码重新登录。</p>
                <p style="font-size: 13px; color: var(--c-text-tertiary); margin: 0 0 16px;">
                    <span id="redirect-sec">3</span> 秒后自动跳转到登录页
                </p>
                <a href="/login"
                   style="display: block; width: 100%; height: 44px; line-height: 44px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--c-bg); background: var(--c-brand); cursor: pointer; text-decoration: none; transition: background 0.15s;"
                   onmouseenter="this.style.background='var(--c-brand-hover)'"
                   onmouseleave="this.style.background='var(--c-brand)'">立即登录</a>
            </div>

        </div>
    </main>
    <script src="/static/vendor/hash-wasm.js"></script>
    <script>
    async function blake2bPrehash(password) {
        return await hashwasm.blake2b(password, 512);
    }

    // ────────────── 从 URL 读取 token ──────────────
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('token') || '';

    const newPw = document.getElementById('input-new-pw');
    const confirmPw = document.getElementById('input-confirm-pw');
    const strBar = document.getElementById('str-bar');
    const strText = document.getElementById('str-text');
    const matchHint = document.getElementById('match-hint');
    const mismatchHint = document.getElementById('mismatch-hint');
    const btnReset = document.getElementById('btn-reset');
    const resetError = document.getElementById('reset-error');
    const tokenErrorBox = document.getElementById('token-error');
    const tokenErrorMsg = document.getElementById('token-error-msg');
    const resetForm = document.getElementById('reset-form');

    // 无 token：显示错误，隐藏表单
    if (!resetToken) {
        tokenErrorBox.style.display = 'block';
        resetForm.style.display = 'none';
    }

    const rules = {
        len: { el: document.getElementById('rule-len'), test: function(p) { return p.length >= 8; } },
        upper: { el: document.getElementById('rule-upper'), test: function(p) { return /[A-Z]/.test(p); } },
        num: { el: document.getElementById('rule-num'), test: function(p) { return /[0-9]/.test(p); } },
        special: { el: document.getElementById('rule-special'), test: function(p) { return /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(p); } }
    };
    const checkSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    const emptySvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>';

    function setRule(r, passed) {
        r.el.querySelector('svg').outerHTML = passed ? checkSvg : emptySvg;
        var span = r.el.querySelector('span');
        span.style.color = passed ? 'var(--c-success)' : 'var(--c-text-tertiary)';
    }

    window.checkStrength = function() {
        var pw = newPw.value;
        var passed = 0;
        for (var k in rules) {
            var ok = rules[k].test(pw);
            setRule(rules[k], ok);
            if (ok) passed++;
        }
        if (pw.length === 0) {
            strBar.style.width = '0%';
            strBar.style.background = 'transparent';
            strText.textContent = '密码强度';
            strText.style.color = 'var(--c-text-tertiary)';
        } else if (passed <= 1) {
            strBar.style.width = '25%';
            strBar.style.background = 'var(--c-error)';
            strText.textContent = '弱';
            strText.style.color = 'var(--c-error)';
        } else if (passed === 2) {
            strBar.style.width = '50%';
            strBar.style.background = 'var(--c-warning)';
            strText.textContent = '一般';
            strText.style.color = 'var(--c-warning)';
        } else if (passed === 3) {
            strBar.style.width = '75%';
            strBar.style.background = 'var(--c-info)';
            strText.textContent = '较强';
            strText.style.color = 'var(--c-info)';
        } else {
            strBar.style.width = '100%';
            strBar.style.background = 'var(--c-success)';
            strText.textContent = '强';
            strText.style.color = 'var(--c-success)';
        }
        checkMatch();
    };

    window.checkMatch = function() {
        var pw = newPw.value;
        var cpw = confirmPw.value;
        if (cpw.length === 0) {
            matchHint.style.display = 'none';
            mismatchHint.style.display = 'none';
        } else if (pw === cpw) {
            matchHint.style.display = 'flex';
            matchHint.style.color = 'var(--c-success)';
            mismatchHint.style.display = 'none';
            confirmPw.style.borderColor = 'var(--c-success)';
        } else {
            matchHint.style.display = 'none';
            mismatchHint.style.display = 'flex';
            mismatchHint.style.color = 'var(--c-error)';
            confirmPw.style.borderColor = 'var(--c-error)';
        }
        updateBtn();
    };

    function allRulesPass() {
        var pw = newPw.value;
        for (var k in rules) { if (!rules[k].test(pw)) return false; }
        return true;
    }

    function updateBtn() {
        var pw = newPw.value;
        var cpw = confirmPw.value;
        var ok = allRulesPass() && pw.length > 0 && pw === cpw;
        btnReset.disabled = !ok;
        btnReset.style.background = ok ? 'var(--c-brand)' : 'var(--c-brand-disabled)';
        btnReset.style.cursor = ok ? 'pointer' : 'not-allowed';
        btnReset.style.opacity = ok ? '1' : '0.6';
    }

    window.togglePw = function(inputId, eyeId) {
        var input = document.getElementById(inputId);
        var isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        var eye = document.getElementById(eyeId);
        if (isPassword) {
            eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    };

    resetForm.addEventListener('submit', async function(evt) {
        evt.preventDefault();
        if (btnReset.disabled || !resetToken) return;
        var pw = newPw.value;
        var cpw = confirmPw.value;
        if (!allRulesPass() || pw !== cpw) {
            resetError.textContent = '请满足所有密码要求';
            return;
        }
        resetError.textContent = '';
        btnReset.disabled = true;
        var origText = btnReset.textContent;
        btnReset.textContent = '重置中...';
        try {
            var prehash = await blake2bPrehash(pw);
            var resp = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    reset_token: resetToken,
                    new_password: prehash
                })
            });
            var data = await resp.json().catch(function() { return {}; });
            if (resp.ok && data.success) {
                // 进入成功页 + 倒计时跳转
                document.getElementById('step-reset').style.display = 'none';
                document.getElementById('step-success').style.display = 'block';
                var sec = 3;
                var secEl = document.getElementById('redirect-sec');
                var interval = setInterval(function() {
                    sec--;
                    if (sec <= 0) {
                        clearInterval(interval);
                        location.href = '/login';
                    } else {
                        secEl.textContent = sec;
                    }
                }, 1000);
            } else {
                // 401/400 通常是 token 已过期或失效
                resetError.textContent = data.message || data.detail || '重置失败，请重新申请';
                // token 失效时显示错误框，隐藏表单
                if (resp.status === 401 || (data.code && data.code.indexOf('auth') >= 0)) {
                    tokenErrorMsg.textContent = data.message || data.detail || '该链接已失效，请重新申请密码重置。';
                    tokenErrorBox.style.display = 'block';
                    resetForm.style.display = 'none';
                }
                btnReset.disabled = false;
                btnReset.textContent = origText;
                updateBtn();
            }
        } catch (e) {
            resetError.textContent = '网络错误，请稍后重试';
            btnReset.disabled = false;
            btnReset.textContent = origText;
            updateBtn();
        }
    });

    lucide.createIcons();
    </script>

</body>
</html>
