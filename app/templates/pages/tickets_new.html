{% extends "frontend_shell.html" %}
{% set active_nav = "tickets" %}
{% set page_title = "我的工单" %}

{% block content %}

        <!-- Page Header -->
        <div class="bg-white px-4 py-3 flex items-center justify-between"
             style="border-bottom: 1px solid var(--c-border);">
            <h1 class="text-lg font-semibold" style="color: var(--c-text-primary);">我的工单</h1>
            <a href="/tickets/new"
                    class="flex items-center gap-1 px-3 py-1 rounded-md text-xs font-medium text-white"
                    style="background-color: var(--c-brand); text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"/>
                    <path d="M5 12h14"/>
                </svg>
                新建工单
            </a>
        </div>

        <!-- Status Filter Pills -->
        <div class="bg-white px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar"
             style="border-bottom: 1px solid var(--c-border);">
            <button class="shrink-0 px-3 py-1 rounded-full text-xs font-medium text-white"
                    style="background-color: var(--c-brand);">全部</button>
            <button class="shrink-0 px-3 py-1 rounded-full text-xs font-medium"
                    style="color: var(--c-text-tertiary); background-color: var(--c-bg-secondary);">待处理</button>
            <button class="shrink-0 px-3 py-1 rounded-full text-xs font-medium"
                    style="color: var(--c-text-tertiary); background-color: var(--c-bg-secondary);">处理中</button>
            <button class="shrink-0 px-3 py-1 rounded-full text-xs font-medium"
                    style="color: var(--c-text-tertiary); background-color: var(--c-bg-secondary);">已解决</button>
            <button class="shrink-0 px-3 py-1 rounded-full text-xs font-medium"
                    style="color: var(--c-text-tertiary); background-color: var(--c-bg-secondary);">已关闭</button>
        </div>

        <!-- Ticket List -->
        <div class="px-4 py-3 flex flex-col gap-3"
             hx-get="/fragments/tickets/list"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- Load More Hint -->
        <div class="flex items-center justify-center py-6">
            <span class="text-xs" style="color: var(--c-text-tertiary);">下拉加载更多</span>
        </div>

{% endblock %}
