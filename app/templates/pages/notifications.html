{% extends "frontend_shell.html" %}
{% set active_nav = "notifications" %}
{% set page_title = "站内信" %}

{% block header %}
<header class="fixed top-0 left-0 right-0 z-50 h-[44px] flex items-center px-4"
        style="background: var(--c-bg); border-bottom: 1px solid var(--c-border);">
    <a href="/dashboard" class="flex items-center"
       style="color: var(--c-text-primary); text-decoration: none; margin-right: 8px;"
       aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
        </svg>
    </a>
    <span style="font-size: 17px; font-weight: 600; color: var(--c-text-primary); flex: 1;">站内信</span>
    <button hx-post="/fragments/notifications/read-all?filter={{ current_filter }}"
            hx-target="#notifications-list"
            hx-swap="innerHTML"
            class="text-xs font-medium"
            style="color: var(--c-brand); background: none; border: none; cursor: pointer; flex-shrink: 0;">
        全部已读
    </button>
</header>
{% endblock %}

{% block content %}

    {# 过滤标签 #}
    <div class="flex gap-2 overflow-x-auto no-scrollbar" style="margin: 12px 16px 0;">
        {% for filter_key, filter_label in filter_tabs %}
        <button hx-get="/fragments/notifications/list?filter={{ filter_key }}"
                hx-target="#notifications-list"
                hx-swap="innerHTML"
                data-filter="{{ filter_key }}"
                class="filter-tab shrink-0 h-[32px] px-[14px] rounded-full text-xs font-medium"
                style="{% if filter_key == current_filter %}background: var(--c-brand); color: var(--c-bg); font-weight: 500;{% else %}border: 1px solid var(--c-border); background: var(--c-bg); color: var(--c-text-secondary); font-weight: 400;{% endif %} white-space: nowrap; cursor: pointer;">
            {{ filter_label }}
        </button>
        {% endfor %}
    </div>

    {# 通知列表（HTMX 加载） #}
    <div id="notifications-list"
         hx-get="/fragments/notifications/list?filter=all"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML"
         style="margin: 12px 16px 0;">
        <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
    </div>

{% endblock %}
