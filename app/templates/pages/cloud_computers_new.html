{% extends "frontend_shell.html" %}
{% set active_nav = "products" %}
{% set page_title = "云电脑" %}

{% block content %}

        <!-- Page Title Area -->
        <div class="flex items-center justify-between px-4 pt-4 pb-3">
            <h1 class="text-[17px] font-semibold" style="color: var(--c-text-primary);">云电脑</h1>
            <button class="flex items-center justify-center w-8 h-8 rounded-full" style="color: var(--c-text-secondary); background: rgba(115,115,115,0.08);">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                    <path d="M11 8v6"/>
                    <path d="M8 11h6"/>
                </svg>
            </button>
        </div>

        <!-- Category Filter Tabs -->
        <div class="flex items-center gap-2 px-4 pb-3 overflow-x-auto no-scrollbar">
            <button class="flex-shrink-0 px-4 flex items-center justify-center rounded-full text-[13px] font-medium transition-colors"
                    style="height: 32px; background: var(--c-brand); color: #ffffff;">
                全部
            </button>
            <button class="flex-shrink-0 px-4 flex items-center justify-center rounded-full text-[13px] font-medium transition-colors"
                    style="height: 32px; background: rgba(115,115,115,0.08); color: var(--c-text-secondary);">
                Windows
            </button>
            <button class="flex-shrink-0 px-4 flex items-center justify-center rounded-full text-[13px] font-medium transition-colors"
                    style="height: 32px; background: rgba(115,115,115,0.08); color: var(--c-text-secondary);">
                Ubuntu
            </button>
            <button class="flex-shrink-0 px-4 flex items-center justify-center rounded-full text-[13px] font-medium transition-colors"
                    style="height: 32px; background: rgba(115,115,115,0.08); color: var(--c-text-secondary);">
                CentOS
            </button>
        </div>

        <!-- Cloud Computers List -->
        <div class="px-4 pb-6"
             hx-get="/fragments/cloud-computers"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- Bottom Safe Area Padding -->
        <div class="h-6"></div>

{% endblock %}
