{% extends "frontend_shell.html" %}
{% set active_nav = "profile" %}
{% set page_title = "修改密码" %}

{% block content %}

        <!-- Custom Nav Header: Back Arrow + Title -->
        <div style="background: var(--c-bg); padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--c-border);">
            <a href="/profile" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: var(--c-text-primary); text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </a>
            <span style="font-size: 16px; font-weight: 600; color: var(--c-text-primary);">修改密码</span>
        </div>

        <!-- Form Card (HTMX-loaded) -->
        <div style="padding: 8px 16px;"
             hx-get="/fragments/profile/change-password-form"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <div style="text-align:center;padding:24px;color:var(--c-text-tertiary);">加载中...</div>
        </div>

        <!-- Spacer to clear the fixed bottom action bar -->
        <div style="height: 80px;"></div>

        <!-- Fixed Bottom Button Bar -->
        <div class="fixed bottom-[56px] left-0 right-0 z-40"
             style="background: var(--c-bg); padding: 16px; border-top: 1px solid var(--c-border);">
            <button id="change-password-submit"
                    type="button"
                    onclick="submitChangePassword()"
                    style="width: 100%; height: 44px; background: var(--c-brand); color: var(--c-bg); border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.15s;"
                    onmouseenter="this.style.background='var(--c-brand-hover)'"
                    onmouseleave="this.style.background='var(--c-brand)'">
                确认修改
            </button>
        </div>

{% endblock %}

{% block scripts %}
<!-- hash-wasm 用于前端 BLAKE2b 预哈希（与登录流程一致） -->
<script src="/static/vendor/hash-wasm.js"></script>
<script>
// 前端 BLAKE2b 预哈希：512 bits → 128 字符 hex
async function blake2bPrehash(password) {
    return await hashwasm.blake2b(password, 512);
}

// 提交修改密码
async function submitChangePassword() {
    var form = document.getElementById('change-password-form');
    var errBox = document.getElementById('change-password-error');
    var btn = document.getElementById('change-password-submit');
    if (!form) return;

    var oldPwd = form.querySelector('[name="current_password"]').value;
    var newPwd = form.querySelector('[name="new_password"]').value;
    var confirmPwd = form.querySelector('[name="confirm_password"]').value;

    // 客户端校验
    if (errBox) { errBox.textContent = ''; errBox.style.display = 'none'; }

    if (!oldPwd || !newPwd || !confirmPwd) {
        showPwdError('请填写完整');
        return;
    }
    if (newPwd.length < 8) {
        showPwdError('新密码长度至少 8 位');
        return;
    }
    if (newPwd !== confirmPwd) {
        showPwdError('两次输入的新密码不一致');
        return;
    }
    if (oldPwd === newPwd) {
        showPwdError('新密码不能与原密码相同');
        return;
    }

    // 禁用按钮
    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = '提交中...';

    try {
        // 前端 BLAKE2b 预哈希（与登录链路一致）
        var oldPre = await blake2bPrehash(oldPwd);
        var newPre = await blake2bPrehash(newPwd);

        var resp = await fetch('/auth/password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + (window.__ACCESS_TOKEN__ || '')
            },
            credentials: 'include',  // 携带 Refresh Cookie 兜底
            body: JSON.stringify({
                old_password: oldPre,
                new_password: newPre
            })
        });

        var data = await resp.json().catch(function() { return {}; });

        if (resp.ok && data.success) {
            // 修改成功：密码变更已递增 ban_version，
            // 原 Access Token 与 Refresh Cookie 均立即失效（无状态撤销）
            // 必须用新密码重新登录
            window.__ACCESS_TOKEN__ = null;
            btn.textContent = '修改成功，请重新登录';
            btn.style.background = 'var(--c-success)';
            setTimeout(function() { location.href = '/login'; }, 1000);
        } else {
            // 失败：显示后端错误信息
            showPwdError(data.message || data.detail || '修改失败，请稍后重试');
            btn.disabled = false;
            btn.textContent = originalText;
        }
    } catch (e) {
        showPwdError('网络错误，请稍后重试');
        btn.disabled = false;
        btn.textContent = originalText;
    }
}

function showPwdError(msg) {
    var errBox = document.getElementById('change-password-error');
    if (errBox) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
    } else {
        alert(msg);
    }
}
</script>
{% endblock %}
