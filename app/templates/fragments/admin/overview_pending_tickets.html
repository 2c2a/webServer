{# 后台概览待处理工单片段 #}
<div class="flex items-center justify-between border-b px-4 sm:px-5 py-3" style="border-color: var(--vercel-border);">
    <h2 class="text-sm font-semibold truncate" style="color: var(--vercel-text-foreground);">待处理工单</h2>
    <a href="/admin/tickets" class="text-xs font-medium whitespace-nowrap" style="color: var(--vercel-text-muted-foreground);">查看全部</a>
</div>
<div class="overflow-x-auto">
    {% if items %}
    <table class="w-full text-xs" style="min-width: 480px;">
        <thead>
            <tr class="border-b text-left" style="border-color: var(--vercel-border); color: var(--vercel-text-muted-foreground);">
                <th class="px-4 sm:px-5 py-2.5 font-medium whitespace-nowrap">工单号</th>
                <th class="px-4 sm:px-5 py-2.5 font-medium whitespace-nowrap">标题</th>
                <th class="px-4 sm:px-5 py-2.5 font-medium whitespace-nowrap">提交人</th>
                <th class="px-4 sm:px-5 py-2.5 font-medium whitespace-nowrap">优先级</th>
                <th class="px-4 sm:px-5 py-2.5 font-medium whitespace-nowrap">创建时间</th>
            </tr>
        </thead>
        <tbody style="color: var(--vercel-text-card-foreground;">
            {% for t in items %}
            <tr class="border-b" style="border-color: var(--vercel-border);">
                <td class="px-4 sm:px-5 py-3 font-mono whitespace-nowrap">{{ t.ticket_no }}</td>
                <td class="px-4 sm:px-5 py-3 truncate min-w-[120px]">{{ t.title }}</td>
                <td class="px-4 sm:px-5 py-3 whitespace-nowrap">{{ t.creator.username if t.creator else '-' }}</td>
                <td class="px-4 sm:px-5 py-3 whitespace-nowrap">
                    <span class="inline-flex h-5 items-center rounded px-1.5 text-xs font-medium whitespace-nowrap"
                          style="background: var(--vercel-status-warning); color: var(--vercel-text-destructive-foreground);">
                        {{ t.priority }}
                    </span>
                </td>
                <td class="px-4 sm:px-5 py-3 whitespace-nowrap" style="color: var(--vercel-text-muted-foreground);">
                    {{ t.created_at.strftime('%Y-%m-%d %H:%M') if t.created_at else '' }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="p-8 text-center text-xs" style="color: var(--vercel-text-muted-foreground);">暂无待处理工单</div>
    {% endif %}
</div>
