{# 后台积分任务创建/编辑表单片段 #}
<div class="mx-auto" style="max-width: 720px;">
    <section class="rounded-md border bg-[var(--vercel-bg-card)] border-[var(--vercel-border)]">
        <div class="border-b px-5 sm:px-6 py-4 border-[var(--vercel-border)]">
            <h1 class="text-base font-bold tracking-tight text-[var(--vercel-text-foreground)]">{% if item %}编辑积分任务{% else %}新增积分任务{% endif %}</h1>
            <p class="mt-1 text-xs text-[var(--vercel-text-muted-foreground)]">{% if item %}修改任务配置{% else %}配置可获积分的任务{% endif %}</p>
        </div>

        <form class="p-5 sm:p-6 space-y-5"
              {% if item %}
              hx-put="/fragments/admin/points/tasks/{{ item.id }}"
              {% else %}
              hx-post="/fragments/admin/points/tasks/create"
              {% endif %}
              hx-target="#admin-content"
              hx-swap="innerHTML">
            <!-- Row 1: 任务名称 -->
            <div>
                <label class="block text-xs font-medium mb-1.5 text-[var(--vercel-text-foreground)]">
                    任务名称 <span class="text-[var(--vercel-status-destructive)]">*</span>
                </label>
                <input type="text" name="name" required
                       value="{{ item.name | default('') }}"
                       placeholder="每日签到"
                       class="w-full h-9 rounded-md border px-3 text-sm outline-none focus:ring-1 bg-[var(--vercel-bg-background)] border-[var(--vercel-border)] text-[var(--vercel-text-foreground)]"
                       style="--tw-ring-color: var(--vercel-accent-ring);" />
            </div>

            <!-- Row 2: 描述 -->
            <div>
                <label class="block text-xs font-medium mb-1.5 text-[var(--vercel-text-foreground)]">描述</label>
                <textarea name="description" rows="2" placeholder="用户每日首次登录时自动发放积分"
                          class="w-full rounded-md border px-3 py-2 text-sm outline-none resize-none focus:ring-1 bg-[var(--vercel-bg-background)] border-[var(--vercel-border)] text-[var(--vercel-text-foreground)]"
                          style="--tw-ring-color: var(--vercel-accent-ring);">{{ item.description | default('') }}</textarea>
            </div>

            <!-- Row 3: 检测方式 + 获得积分 (2-col) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium mb-1.5 text-[var(--vercel-text-foreground)]">
                        检测方式 <span class="text-[var(--vercel-status-destructive)]">*</span>
                    </label>
                    <select name="detection_method" required
                            class="w-full h-9 rounded-md border px-3 text-sm outline-none focus:ring-1 appearance-none bg-[var(--vercel-bg-background)] border-[var(--vercel-border)] text-[var(--vercel-text-foreground)]"
                            style="--tw-ring-color: var(--vercel-accent-ring);">
                        <option value="">请选择...</option>
                        <option value="daily_checkin" {% if item and item.detection_method == 'daily_checkin' %}selected{% endif %}>每日签到</option>
                        <option value="ticket_submit" {% if item and item.detection_method == 'ticket_submit' %}selected{% endif %}>工单提交</option>
                        <option value="first_login" {% if item and item.detection_method == 'first_login' %}selected{% endif %}>首次登录</option>
                        <option value="consecutive_checkin" {% if item and item.detection_method == 'consecutive_checkin' %}selected{% endif %}>连续签到</option>
                        <option value="plugin_inject" {% if item and item.detection_method == 'plugin_inject' %}selected{% endif %}>插件注入</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1.5 text-[var(--vercel-text-foreground)]">
                        获得积分 <span class="text-[var(--vercel-status-destructive)]">*</span>
                    </label>
                    <input type="number" name="points" required
                           value="{{ item.points | default(10) }}" min="0"
                           class="w-full h-9 rounded-md border px-3 text-sm outline-none focus:ring-1 bg-[var(--vercel-bg-background)] border-[var(--vercel-border)] text-[var(--vercel-text-foreground)]"
                           style="--tw-ring-color: var(--vercel-accent-ring);" />
                    <p class="mt-1 text-xs text-[var(--vercel-text-muted-foreground)]">完成此任务获得的积分数量（可为负，表示扣分）</p>
                </div>
            </div>

            <!-- Row 4: 启用 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium mb-1.5 text-[var(--vercel-text-foreground)]">启用</label>
                    <div class="flex items-center gap-2.5 pt-1">
                        <button type="button"
                                class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full transition-colors duration-200"
                                style="background: {% if not item or item.is_active %}var(--vercel-accent-primary){% else %}var(--vercel-accent-input){% endif %};"
                                onclick="toggleSwitch(this)" aria-label="启用开关">
                            <span class="pointer-events-none inline-block h-4 w-4 rounded-full transition-transform duration-200 mt-0.5"
                                  style="background: var(--vercel-text-primary-foreground); transform: {% if not item or item.is_active %}translateX(16px){% else %}translateX(0){% endif %};"></span>
                        </button>
                        <input type="hidden" name="is_active" value="{% if not item or item.is_active %}true{% else %}false{% endif %}" class="is-active-input">
                        <span class="text-xs toggle-label text-[var(--vercel-text-muted-foreground)]">{% if not item or item.is_active %}已启用{% else %}已禁用{% endif %}</span>
                    </div>
                </div>
            </div>

            <!-- Separator -->
            <div class="border-t border-[var(--vercel-border)]"></div>

            <!-- Advanced config -->
            <div>
                <button type="button" class="flex items-center gap-2 text-xs font-medium text-[var(--vercel-text-foreground)]" onclick="toggleAdvanced(this)">
                    <i data-lucide="chevron-right" class="h-3.5 w-3.5 shrink-0 transition-transform duration-200"></i>
                    高级配置
                    <span class="advanced-hint text-xs font-normal text-[var(--vercel-text-muted-foreground)]">展开</span>
                </button>
                <div class="advanced-section hidden mt-4 space-y-3">
                    <div>
                        <label class="block text-xs font-medium mb-1.5 text-[var(--vercel-text-foreground)]">定制配置 (JSON)</label>
                        <textarea name="config" rows="5"
                                  placeholder='{&#10;  "check_window": "00:00-23:59",&#10;  "consecutive_days": 7,&#10;  "category_id": null&#10;}'
                                  class="w-full rounded-md border px-3 py-2 text-sm outline-none resize-none focus:ring-1 bg-[var(--vercel-bg-background)] border-[var(--vercel-border)] text-[var(--vercel-text-foreground)]"
                                  style="font-family: var(--vercel-font-mono); --tw-ring-color: var(--vercel-accent-ring);">{% if item and item.config %}{{ item.config | tojson }}{% endif %}</textarea>
                        <p class="mt-1 text-xs text-[var(--vercel-text-muted-foreground)]">根据检测方式不同，配置项也不同。工单提交可指定 category_id</p>
                    </div>
                </div>
            </div>

            <!-- Actions separator -->
            <div class="border-t border-[var(--vercel-border)]"></div>

            <!-- Action buttons -->
            <div class="flex items-center justify-end gap-3">
                <a href="/admin/points" class="inline-flex h-9 items-center rounded-md px-4 text-sm font-medium border bg-transparent text-[var(--vercel-text-foreground)] border-[var(--vercel-border)]">
                    取消
                </a>
                <button type="submit" class="inline-flex h-9 items-center rounded-md px-4 text-sm font-medium text-[var(--vercel-text-primary-foreground)] bg-[var(--vercel-accent-primary)]">
                    保存
                </button>
            </div>
        </form>
    </section>
</div>

<script>
    (function() {
        window.toggleSwitch = function(btn) {
            const dot = btn.querySelector('span');
            const wrapper = btn.parentElement;
            const label = wrapper.querySelector('.toggle-label');
            const input = wrapper.querySelector('.is-active-input');
            if (btn.style.background === 'var(--vercel-accent-primary)' || btn.style.background === '') {
                btn.style.background = 'var(--vercel-accent-input)';
                dot.style.transform = 'translateX(0)';
                label.textContent = '已禁用';
                input.value = 'false';
            } else {
                btn.style.background = 'var(--vercel-accent-primary)';
                dot.style.transform = 'translateX(16px)';
                label.textContent = '已启用';
                input.value = 'true';
            }
        };
        window.toggleAdvanced = function(btn) {
            const section = btn.parentElement.querySelector('.advanced-section');
            const icon = btn.querySelector('i');
            const hint = btn.querySelector('.advanced-hint');
            if (section.classList.contains('hidden')) {
                section.classList.remove('hidden');
                icon.style.transform = 'rotate(90deg)';
                hint.textContent = '收起';
            } else {
                section.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
                hint.textContent = '展开';
            }
        };
    })();
</script>
