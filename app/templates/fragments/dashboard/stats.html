{# 仪表盘统计片段 #}
<div style="padding: 8px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    <div style="background: #ffffff; border-radius: 8px; padding: 14px;">
        <p style="font-size: 28px; font-weight: 700; color: var(--c-brand); margin: 0 0 4px;">{{ pending_count }}</p>
        <p style="font-size: 12px; color: var(--c-text-tertiary); margin: 0;">待处理工单</p>
    </div>
    <div style="background: #ffffff; border-radius: 8px; padding: 14px;">
        <p style="font-size: 28px; font-weight: 700; color: var(--c-success); margin: 0 0 4px;">{{ resolved_count }}</p>
        <p style="font-size: 12px; color: var(--c-text-tertiary); margin: 0;">已解决工单</p>
    </div>
</div>
