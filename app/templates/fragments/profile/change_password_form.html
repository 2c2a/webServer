{# 修改密码表单片段。
   字段名与 /auth/password 接口对齐（前端 BLAKE2b 预哈希后提交）。 #}
<form id="change-password-form" style="background: var(--c-bg); border-radius: 12px; padding: 16px;">
    <!-- Current Password -->
    <div>
        <label style="display: block; font-size: 12px; color: var(--c-text-secondary); margin-bottom: 4px;">当前密码</label>
        <input type="password" name="current_password" placeholder="请输入当前密码" autocomplete="current-password"
               style="width: 100%; height: 44px; border: 1px solid var(--c-border); border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--c-text-primary); background: var(--c-bg); outline: none; box-sizing: border-box; font-family: inherit;"
               onfocus="this.style.borderColor='var(--c-brand)'"
               onblur="this.style.borderColor='var(--c-border)'">
    </div>

    <div style="height: 16px;"></div>

    <!-- New Password -->
    <div>
        <label style="display: block; font-size: 12px; color: var(--c-text-secondary); margin-bottom: 4px;">新密码</label>
        <input type="password" name="new_password" placeholder="请输入新密码" autocomplete="new-password"
               style="width: 100%; height: 44px; border: 1px solid var(--c-border); border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--c-text-primary); background: var(--c-bg); outline: none; box-sizing: border-box; font-family: inherit;"
               onfocus="this.style.borderColor='var(--c-brand)'"
               onblur="this.style.borderColor='var(--c-border)'">
    </div>

    <div style="height: 16px;"></div>

    <!-- Confirm New Password -->
    <div>
        <label style="display: block; font-size: 12px; color: var(--c-text-secondary); margin-bottom: 4px;">确认新密码</label>
        <input type="password" name="confirm_password" placeholder="请再次输入新密码" autocomplete="new-password"
               style="width: 100%; height: 44px; border: 1px solid var(--c-border); border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--c-text-primary); background: var(--c-bg); outline: none; box-sizing: border-box; font-family: inherit;"
               onfocus="this.style.borderColor='var(--c-brand)'"
               onblur="this.style.borderColor='var(--c-border)'">
    </div>

    <div style="height: 8px;"></div>

    <!-- Hint Text -->
    <p style="font-size: 11px; color: var(--c-text-tertiary); margin: 0; line-height: 1.5;">密码长度不少于 8 位</p>

    <!-- Error Display -->
    <div id="change-password-error"
         style="display: none; margin-top: 12px; padding: 8px 12px; background: rgba(255,71,87,0.08); border-radius: 6px; font-size: 13px; color: var(--c-error); line-height: 1.5;">
    </div>
</form>
