; ============================================================
; 2c2a Application - Supervisor Configuration
; PHP + Node.js deployment
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ============================================================
; Program: PHP-FPM
; ============================================================
[program:php-fpm]
command=/usr/sbin/php-fpm8.2 --nodaemonize --fpm-config /etc/php/8.2/fpm/pool.d/2c2a.conf
autostart=true
autorestart=true
priority=5
user=root
stdout_logfile=/var/log/2c2a/php-fpm.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/2c2a/php-fpm.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopwaitsecs=30
stopsignal=QUIT

; ============================================================
; Program: Node.js Worker - Default Queue
; ============================================================
[program:2c2a-worker-default]
command=/usr/bin/node /var/www/2c2a/worker/index.js --queue default
directory=/var/www/2c2a/worker
autostart=true
autorestart=true
priority=20
user=www-data
environment=HOME="/var/www/2c2a",NODE_ENV="production",PATH="/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/2c2a/worker-default.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/2c2a/worker-default.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopwaitsecs=15
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

; ============================================================
; Program: Node.js Worker - Hosts Queue
; ============================================================
[program:2c2a-worker-hosts]
command=/usr/bin/node /var/www/2c2a/worker/index.js --queue hosts
directory=/var/www/2c2a/worker
autostart=true
autorestart=true
priority=15
user=www-data
environment=HOME="/var/www/2c2a",NODE_ENV="production",PATH="/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/2c2a/worker-hosts.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/2c2a/worker-hosts.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopwaitsecs=15
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

; ============================================================
; Program: Node.js Worker - Operations Queue
