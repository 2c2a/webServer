user=www-data
environment=HOME="/var/www/2c2a",NODE_ENV="production",PATH="/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/2c2a/worker-bootstrap.stdout.log
stdout_logfile_maxbytes=10MB
