; ============================================================
; Program: Node.js Scheduler
; ============================================================
[program:2c2a-scheduler]
command=/usr/bin/node -e "require('./scheduler').start(); setInterval(() => {}, 60000);"
directory=/var/www/2c2a/worker
autostart=true
autorestart=true
priority=25
user=www-data
environment=HOME="/var/www/2c2a",NODE_ENV="production",PATH="/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/log/2c2a/scheduler.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/2c2a/scheduler.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopwaitsecs=10
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

; ============================================================
; Group: 2c2a (all programs)
; ============================================================
[group:2c2a]
programs=php-fpm,2c2a-worker-default,2c2a-worker-hosts,2c2a-worker-operations,2c2a-worker-bootstrap,2c2a-worker-certificates,2c2a-scheduler
priority=999
