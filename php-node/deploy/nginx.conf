# ============================================================
# 2c2a Application - Nginx Configuration
# PHP + Node.js deployment
# ============================================================

# Upstream PHP-FPM
upstream php-fpm {
    server 127.0.0.1:9000;
}

# Rate limiting zone for login endpoints
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/2c2a/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ----------------------------------------------------------
    # SSL Configuration
    # ----------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/2c2a.crt;
    ssl_certificate_key /etc/ssl/private/2c2a.key;

    # Modern cipher suite (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS (6 months, include subdomains)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # ----------------------------------------------------------
    # Document Root
    # ----------------------------------------------------------
    root /var/www/2c2a/public;
    index index.php index.html;

    # ----------------------------------------------------------
    # Security Headers
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ----------------------------------------------------------
    # Gzip Compression
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml;

    # ----------------------------------------------------------
    # Client Settings
    # ----------------------------------------------------------
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ----------------------------------------------------------
    # Deny access to hidden files (e.g. .env, .git, .htaccess)
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # Deny access to sensitive directories
    # ----------------------------------------------------------
    location ~ ^/(app|templates|sql|worker)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # Static files with caching headers
    # ----------------------------------------------------------
    location /static/ {
        alias /var/www/2c2a/public/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ----------------------------------------------------------
    # Media files (avatars, attachments, etc.)
    # ----------------------------------------------------------
    location /media/ {
        alias /var/www/2c2a/storage/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(png|jpg|jpeg|gif|ico|svg|pdf|zip)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # ----------------------------------------------------------
    # Certificate files (restricted access)
    # ----------------------------------------------------------
    location /certs/ {
        internal;
        alias /var/www/2c2a/storage/certs/;
    }

    # ----------------------------------------------------------
    # Rate-limited login endpoints
    # ----------------------------------------------------------
    location = /login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ----------------------------------------------------------
    # PHP processing via FPM
    # ----------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # Standard FastCGI params
        include fastcgi_params;

        # Script name and path info
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;

        # Query string
        fastcgi_param QUERY_STRING $query_string;

        # Request info
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Server protocol and scheme
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param HTTPS $https if_not_empty;

        # Pass application environment variables to PHP workers
        fastcgi_param APP_SECRET_KEY $env_app_secret_key if_not_empty;
        fastcgi_param APP_DEBUG $env_app_debug if_not_empty;
        fastcgi_param APP_URL $env_app_url if_not_empty;
        fastcgi_param DB_HOST $env_db_host if_not_empty;
        fastcgi_param DB_PORT $env_db_port if_not_empty;
        fastcgi_param DB_NAME $env_db_name if_not_empty;
        fastcgi_param DB_USER $env_db_user if_not_empty;
        fastcgi_param DB_PASSWORD $env_db_password if_not_empty;
        fastcgi_param REDIS_URL $env_redis_url if_not_empty;
        fastcgi_param GATEWAY_ENABLED $env_gateway_enabled if_not_empty;
        fastcgi_param GATEWAY_ADDRESS $env_gateway_address if_not_empty;
        fastcgi_param GATEWAY_PORT $env_gateway_port if_not_empty;
        fastcgi_param GATEWAY_PAA_TOKEN_SIGNING_KEY $env_gateway_paa_token_signing_key if_not_empty;
        fastcgi_param RDP_DOMAIN $env_rdp_domain if_not_empty;
        fastcgi_param 2C2A_DEMO $env_2c2a_demo if_not_empty;

        # FastCGI buffers for larger responses
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 120s;
    }

    # ----------------------------------------------------------
    # Default URL routing (front controller pattern)
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ----------------------------------------------------------
    # Favicon and robots.txt
    # ----------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }

    # ----------------------------------------------------------
    # Custom error pages
    # ----------------------------------------------------------
    error_page 404 /errors/404.php;
    location = /errors/404.php {
        internal;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root/errors/404.php;
        include fastcgi_params;
    }

    error_page 500 502 503 504 /errors/500.php;
    location = /errors/500.php {
        internal;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root/errors/500.php;
        include fastcgi_params;
    }

    # ----------------------------------------------------------
    # Logging
    # ----------------------------------------------------------
    access_log /var/log/nginx/2c2a_access.log;
    error_log  /var/log/nginx/2c2a_error.log warn;
}
