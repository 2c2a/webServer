; ============================================================
; 2c2a Application - PHP-FPM Pool Configuration
; Pool name: 2c2a
; ============================================================

[2c2a]

; ----------------------------------------------------------
; Pool identity
; ----------------------------------------------------------
user = www-data
group = www-data

; ----------------------------------------------------------
; Listen configuration
; ----------------------------------------------------------
listen = 127.0.0.1:9000
listen.backlog = 511
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Allowed clients (only nginx on same host)
listen.allowed_clients = 127.0.0.1

; ----------------------------------------------------------
; Process Manager - Dynamic
; ----------------------------------------------------------
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Status page (accessible at /status for monitoring)
pm.status_path = /status
pm.status_listen = 127.0.0.1:9001

; Ping endpoint for health checks
ping.path = /ping
ping.response = pong

; ----------------------------------------------------------
; Logging
; ----------------------------------------------------------
access.log = /var/log/2c2a/php-fpm-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Slowlog configuration
slowlog = /var/log/2c2a/php-fpm-slowlog.log
request_slowlog_timeout = 5s
request_terminate_timeout = 120s

; ----------------------------------------------------------
; PHP settings overrides
; ----------------------------------------------------------
php_admin_value[expose_php] = off
php_admin_value[session.save_handler] = redis
php_admin_value[session.save_path] = "tcp://127.0.0.1:6379?database=0&prefix=2c2a:sess:"
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[memory_limit] = 256M
php_admin_value[display_errors] = off
php_admin_value[log_errors] = on
php_admin_value[error_log] = /var/log/2c2a/php-errors.log
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_admin_value[date.timezone] = Asia/Shanghai
php_admin_value[session.cookie_httponly] = on
php_admin_value[session.cookie_secure] = on
php_admin_value[session.use_strict_mode] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[open_basedir] = /var/www/2c2a:/tmp:/usr/share/php
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[opcache.enable] = on
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = off
php_admin_value[opcache.save_comments] = on
php_admin_value[opcache.fast_shutdown] = on

; ----------------------------------------------------------
; Environment variables passed to PHP workers
; These are read from the system environment or .env file
; ----------------------------------------------------------
env[APP_SECRET_KEY] = $APP_SECRET_KEY
env[APP_DEBUG] = $APP_DEBUG
env[APP_URL] = $APP_URL
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD] = $DB_PASSWORD
env[REDIS_URL] = $REDIS_URL
env[SMTP_HOST] = $SMTP_HOST
env[SMTP_PORT] = $SMTP_PORT
env[SMTP_USE_TLS] = $SMTP_USE_TLS
env[SMTP_USERNAME] = $SMTP_USERNAME
env[SMTP_PASSWORD] = $SMTP_PASSWORD
env[SMTP_FROM_EMAIL] = $SMTP_FROM_EMAIL
env[GATEWAY_ENABLED] = $GATEWAY_ENABLED
env[GATEWAY_ADDRESS] = $GATEWAY_ADDRESS
env[GATEWAY_PORT] = $GATEWAY_PORT
env[GATEWAY_PAA_TOKEN_SIGNING_KEY] = $GATEWAY_PAA_TOKEN_SIGNING_KEY
env[RDP_DOMAIN] = $RDP_DOMAIN
env[2C2A_DEMO] = $2C2A_DEMO

; ----------------------------------------------------------
; Security
; ----------------------------------------------------------
security.limit_extensions = .php

; ----------------------------------------------------------
; Worker defaults
; ----------------------------------------------------------
rlimit_files = 65535
rlimit_core = 0
