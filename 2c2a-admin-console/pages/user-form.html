<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增/编辑用户 — 2c2a</title>
    <style id="theme-vars">
/* 2c2a Admin Console — Vercel-inspired design tokens */
/* Brand prefix: vercel */

:root {
  /* ── Background ── */
  --vercel-bg-background: #ffffff;
  --vercel-bg-card: #ffffff;
  --vercel-bg-popover: #ffffff;
  --vercel-bg-muted: #f5f5f5;

  /* ── Text ── */
  --vercel-text-foreground: #0a0a0a;
  --vercel-text-card-foreground: #0a0a0a;
  --vercel-text-popover-foreground: #0a0a0a;
  --vercel-text-primary-foreground: #fafafa;
  --vercel-text-secondary-foreground: #171717;
  --vercel-text-muted-foreground: #858585;
  --vercel-text-accent-foreground: #171717;
  --vercel-text-destructive-foreground: #ffffff;

  /* ── Accent ── */
  --vercel-accent-primary: #121212;
  --vercel-accent-secondary: #f5f5f5;
  --vercel-accent-accent: #f5f5f5;
  --vercel-accent-input: #e5e5e5;
  --vercel-accent-ring: #0d0d0d;

  /* ── Border ── */
  --vercel-border: #e8e8e8;

  /* ── Status ── */
  --vercel-status-destructive: #e7000b;
  --vercel-status-success: #16a34a;
  --vercel-status-warning: #ca8a04;
  --vercel-status-info: #2563eb;

  /* ── Chart ── */
  --vercel-chart-1: #91c5ff;
  --vercel-chart-2: #3a81f6;
  --vercel-chart-3: #2563eb;
  --vercel-chart-4: #1a4eda;
  --vercel-chart-5: #1f3fad;

  /* ── Sidebar ── */
  --vercel-sidebar-bg: #fafafa;
  --vercel-sidebar-foreground: #0a0a0a;
  --vercel-sidebar-primary: #171717;
  --vercel-sidebar-primary-foreground: #fafafa;
  --vercel-sidebar-accent: #f5f5f5;
  --vercel-sidebar-accent-foreground: #171717;
  --vercel-sidebar-border: #e5e5e5;
  --vercel-sidebar-ring: #a1a1a1;

  /* ── Typography ── */
  --vercel-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --vercel-font-mono: 'Geist Mono', 'SF Mono', 'Fira Code', monospace;
  --vercel-font-size-xs: 0.75rem;
  --vercel-font-size-sm: 0.8125rem;
  --vercel-font-size-base: 0.875rem;
  --vercel-font-size-lg: 1rem;
  --vercel-font-size-xl: 1.25rem;
  --vercel-font-size-2xl: 1.5rem;
  --vercel-font-size-3xl: 1.875rem;
  --vercel-line-height-tight: 1.25;
  --vercel-line-height-normal: 1.5;
  --vercel-line-height-relaxed: 1.625;

  /* ── Spacing ── */
  --vercel-spacing-unit: 0.25rem;
  --vercel-spacing-1: 0.25rem;
  --vercel-spacing-2: 0.5rem;
  --vercel-spacing-3: 0.75rem;
  --vercel-spacing-4: 1rem;
  --vercel-spacing-5: 1.25rem;
  --vercel-spacing-6: 1.5rem;
  --vercel-spacing-8: 2rem;
  --vercel-spacing-10: 2.5rem;
  --vercel-spacing-12: 3rem;

  /* ── Radius ── */
  --vercel-radius: 0.5rem;
  --vercel-radius-sm: 0.25rem;
  --vercel-radius-md: 0.5rem;
  --vercel-radius-lg: 0.5rem;
  --vercel-radius-full: 9999px;

  /* ── Shadow ── */
  --vercel-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --vercel-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);

  /* ── Transition ── */
  --vercel-transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --vercel-transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Dark mode ── */
.dark {
  --vercel-bg-background: #0a0a0a;
  --vercel-bg-card: #171717;
  --vercel-bg-popover: #262626;
  --vercel-bg-muted: #262626;

  --vercel-text-foreground: #fafafa;
  --vercel-text-card-foreground: #fafafa;
  --vercel-text-popover-foreground: #fafafa;
  --vercel-text-primary-foreground: #171717;
  --vercel-text-secondary-foreground: #fafafa;
  --vercel-text-muted-foreground: #a1a1a1;
  --vercel-text-accent-foreground: #fafafa;
  --vercel-text-destructive-foreground: #ffffff;

  --vercel-accent-primary: #e5e5e5;
  --vercel-accent-secondary: #262626;
  --vercel-accent-accent: #262626;
  --vercel-accent-input: #404040;
  --vercel-accent-ring: #a3a3a3;

  --vercel-border: #404040;

  --vercel-status-destructive: #ff3b4a;

  --vercel-chart-1: #5b9aff;
  --vercel-chart-2: #5b9aff;
  --vercel-chart-3: #91c5ff;
  --vercel-chart-4: #91c5ff;
  --vercel-chart-5: #5b9aff;

  --vercel-sidebar-bg: #0a0a0a;
  --vercel-sidebar-foreground: #fafafa;
  --vercel-sidebar-primary: #e5e5e5;
  --vercel-sidebar-primary-foreground: #0a0a0a;
  --vercel-sidebar-accent: #262626;
  --vercel-sidebar-accent-foreground: #fafafa;
  --vercel-sidebar-border: #262626;
  --vercel-sidebar-ring: #525252;

  --vercel-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --vercel-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px -1px rgba(0, 0, 0, 0.3);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--vercel-border);
    --color-chart-1: var(--vercel-chart-1);
    --color-chart-2: var(--vercel-chart-2);
    --color-chart-3: var(--vercel-chart-3);
    --color-chart-4: var(--vercel-chart-4);
    --color-chart-5: var(--vercel-chart-5);
    --color-sidebar-foreground: var(--vercel-sidebar-foreground);
    --color-sidebar-primary: var(--vercel-sidebar-primary);
    --color-sidebar-primary-foreground: var(--vercel-sidebar-primary-foreground);
    --color-sidebar-accent: var(--vercel-sidebar-accent);
    --color-sidebar-accent-foreground: var(--vercel-sidebar-accent-foreground);
  }
  @layer base {
    body { background: var(--vercel-background); color: var(--vercel-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
<main>
<!-- Mobile hamburger -->
<label for="sidebar-toggle" class="lg:hidden fixed top-3 left-3 z-50 inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg border border-[var(--vercel-border)] bg-[var(--vercel-bg-card)]" aria-label="打开侧边栏">
  <i data-lucide="menu" class="h-4 w-4"></i>
</label>
<input type="checkbox" id="sidebar-toggle" class="hidden">

<!-- Mobile overlay -->
<div id="sidebar-overlay" class="hidden fixed inset-0 z-40 bg-black/40 lg:hidden"></div>

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-60 -translate-x-full border-r border-[var(--vercel-sidebar-border)] bg-[var(--vercel-sidebar-bg)] transition-transform duration-200 lg:static lg:translate-x-0">
    <div class="flex h-14 items-center gap-2 border-b border-[var(--vercel-sidebar-border)] px-4">
      <i data-lucide="shield" class="h-5 w-5 text-[var(--vercel-sidebar-foreground)]"></i>
      <span class="text-sm font-semibold tracking-tight text-[var(--vercel-sidebar-foreground)]">2c2a</span>
    </div>
    <nav class="flex flex-col gap-0.5 p-2">
      <a href="#" data-dom-id="nav-overview" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
        <span>概览</span>
      </a>
      <a href="#" data-dom-id="nav-users" class="flex items-center gap-2.5 rounded-md bg-[var(--vercel-sidebar-accent)] px-3 py-2 text-sm font-semibold text-[var(--vercel-sidebar-accent-foreground)]">
        <i data-lucide="users" class="h-4 w-4"></i>
        <span>用户管理</span>
      </a>
      <a href="#" data-dom-id="nav-hosts" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="server" class="h-4 w-4"></i>
        <span>主机管理</span>
      </a>
      <a href="#" data-dom-id="nav-tickets" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="ticket" class="h-4 w-4"></i>
        <span>工单管理</span>
      </a>
      <a href="#" data-dom-id="nav-openings" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="user-plus" class="h-4 w-4"></i>
        <span>开户申请</span>
      </a>
      <a href="#" data-dom-id="nav-products" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="package" class="h-4 w-4"></i>
        <span>产品管理</span>
      </a>
      <a href="#" data-dom-id="nav-points" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="coins" class="h-4 w-4"></i>
        <span>积分管理</span>
      </a>
      <a href="#" data-dom-id="nav-audit" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="file-text" class="h-4 w-4"></i>
        <span>审计日志</span>
      </a>
      <a href="#" data-dom-id="nav-sitegroups" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="building-2" class="h-4 w-4"></i>
        <span>站点组管理</span>
      </a>
      <a href="#" data-dom-id="nav-settings" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm text-[var(--vercel-sidebar-foreground)] transition-colors hover:bg-[var(--vercel-sidebar-accent)]">
        <i data-lucide="settings" class="h-4 w-4"></i>
        <span>系统配置</span>
      </a>
    </nav>
  </aside>

  <!-- Main content area -->
  <div class="flex-1 overflow-x-auto">
    <!-- Breadcrumb -->
    <div class="border-b border-[var(--vercel-border)] bg-[var(--vercel-bg-background)] px-4 py-3 lg:px-6">
      <nav class="flex items-center gap-1.5 text-sm text-[var(--vercel-text-muted-foreground)]">
        <a href="#" data-dom-id="nav-users" class="transition-colors hover:text-[var(--vercel-text-foreground)]">用户管理</a>
        <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
        <span class="text-[var(--vercel-text-foreground)]">新增用户</span>
      </nav>
    </div>

    <!-- Form card -->
    <div class="px-4 py-6 lg:px-6">
      <div class="mx-auto max-w-[720px]">
        <h1 class="text-lg font-semibold tracking-tight text-[var(--vercel-text-foreground)]">新增用户</h1>
        <p class="mt-1 text-sm text-[var(--vercel-text-muted-foreground)]">创建新的管理后台用户账户</p>

        <div class="mt-6 rounded-lg border border-[var(--vercel-border)] bg-[var(--vercel-bg-card)]">
          <form class="p-5 sm:p-6">
            <!-- 2-col grid on desktop, 1-col on mobile -->
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">

              <!-- 用户名 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">
                  用户名 <span class="text-[var(--vercel-status-destructive)]">*</span>
                </label>
                <input type="text" required placeholder="请输入用户名" class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] placeholder:text-[var(--vercel-text-muted-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
              </div>

              <!-- 邮箱 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">
                  邮箱 <span class="text-[var(--vercel-status-destructive)]">*</span>
                </label>
                <input type="email" required placeholder="user@example.com" class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] placeholder:text-[var(--vercel-text-muted-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
              </div>

              <!-- 初始密码 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">初始密码</label>
                <div class="relative">
                  <input id="password-input" type="password" placeholder="请输入初始密码" class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 pr-9 text-sm text-[var(--vercel-text-foreground)] placeholder:text-[var(--vercel-text-muted-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
                  <button type="button" class="absolute right-2 top-1/2 inline-flex h-5 w-5 -translate-y-1/2 items-center justify-center text-[var(--vercel-text-muted-foreground)] transition-colors hover:text-[var(--vercel-text-foreground)]" onclick="const inp=document.getElementById('password-input');inp.type=inp.type==='password'?'text':'password'" aria-label="切换密码可见性">
                    <i data-lucide="eye" class="h-4 w-4"></i>
                  </button>
                </div>
                <p class="mt-1 text-xs text-[var(--vercel-text-muted-foreground)]">密码经 BLAKE2b + Argon2id 双重哈希存储</p>
              </div>

              <!-- 确认密码 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">确认密码</label>
                <div class="relative">
                  <input id="confirm-password-input" type="password" placeholder="请再次输入密码" class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 pr-9 text-sm text-[var(--vercel-text-foreground)] placeholder:text-[var(--vercel-text-muted-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
                  <button type="button" class="absolute right-2 top-1/2 inline-flex h-5 w-5 -translate-y-1/2 items-center justify-center text-[var(--vercel-text-muted-foreground)] transition-colors hover:text-[var(--vercel-text-foreground)]" onclick="const inp=document.getElementById('confirm-password-input');inp.type=inp.type==='password'?'text':'password'" aria-label="切换密码可见性">
                    <i data-lucide="eye" class="h-4 w-4"></i>
                  </button>
                </div>
              </div>

              <!-- 角色 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">角色</label>
                <select class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
                  <option value="user">普通用户</option>
                  <option value="staff">Staff</option>
                  <option value="admin">管理员</option>
                </select>
              </div>

              <!-- 所属站点组 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">所属站点组</label>
                <select class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
                  <option value="default">默认站点</option>
                  <option value="education">教育站点</option>
                  <option value="testing">测试站点</option>
                </select>
              </div>

              <!-- 所属用户组 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">所属用户组</label>
                <select class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
                  <option value="default">默认组</option>
                  <option value="ops">运维组</option>
                  <option value="education">教育组</option>
                </select>
              </div>

              <!-- 初始积分 -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">初始积分</label>
                <input type="number" value="0" min="0" class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)]">
                <p class="mt-1 text-xs text-[var(--vercel-text-muted-foreground)]">发放初始积分</p>
              </div>

              <!-- 状态 toggle -->
              <div class="sm:col-span-2">
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">状态</label>
                <div class="flex items-center gap-3">
                  <button type="button" id="status-toggle" onclick="const btn=this;const track=btn.querySelector('span');const isOn=track.dataset.on==='true';track.dataset.on=isOn?'false':'true'" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full transition-colors" style="background:var(--vercel-status-success)" data-state="on" aria-label="切换启用状态">
                    <span data-on="true" class="pointer-events-none inline-block h-4 w-4 translate-x-6 rounded-full bg-white transition-transform duration-200"></span>
                  </button>
                  <span class="text-sm text-[var(--vercel-text-foreground)]">启用</span>
                </div>
              </div>

              <!-- 备注 -->
              <div class="sm:col-span-2">
                <label class="mb-1.5 block text-sm font-medium text-[var(--vercel-text-foreground)]">备注</label>
                <textarea rows="2" placeholder="可选备注信息" class="w-full rounded-md border border-[var(--vercel-accent-input)] bg-[var(--vercel-bg-background)] px-3 py-2 text-sm text-[var(--vercel-text-foreground)] placeholder:text-[var(--vercel-text-muted-foreground)] focus:border-[var(--vercel-accent-ring)] focus:outline-none focus:ring-1 focus:ring-[var(--vercel-accent-ring)] resize-none"></textarea>
              </div>
            </div>

            <!-- Separator -->
            <div class="my-6 border-t border-[var(--vercel-border)]"></div>

            <!-- Actions -->
            <div class="flex justify-end gap-3">
              <button type="button" class="inline-flex items-center rounded-md border border-[var(--vercel-border)] bg-[var(--vercel-bg-background)] px-4 py-2 text-sm font-medium text-[var(--vercel-text-foreground)] transition-colors hover:bg-[var(--vercel-bg-muted)]">
                取消
              </button>
              <button type="submit" class="inline-flex items-center rounded-md bg-[var(--vercel-accent-primary)] px-4 py-2 text-sm font-medium text-[var(--vercel-text-primary-foreground)] transition-colors hover:opacity-90">
                保存
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile sidebar toggle script (CSS-only state changes only) -->
<style>
  #sidebar-toggle:checked ~ #sidebar { translate: 0; }
  #sidebar-toggle:checked ~ #sidebar-overlay { display: block; }
</style>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
