<body class="min-h-screen font-sans antialiased" style="background: var(--c-bg-secondary); color: var(--c-text-primary); font-family: 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; overflow-y: auto;">

    <header class="fixed top-0 left-0 right-0 z-50 h-[44px] flex items-center justify-between px-4"

        <a href="#" data-dom-id="back-my-cloud" class="flex items-center justify-center w-8 h-8" style="color: var(--c-text-primary);">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"

            </svg>
        </a>
        <span style="font-size: 16px; font-weight: 600; color: var(--c-text-primary);">云电脑详情</span>

    </header>

    <!-- Main Content -->
    <main id="main-content" style="padding-top: 44px; padding-bottom: 112px;">

        <!-- 1. Status Banner -->
        <div style="margin: 12px 16px 0; background: var(--c-success); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-bg); display: inline-block;"></span>
                <span style="font-size: 14px; font-weight: 500; color: var(--c-bg);">运行中</span>
            </div>
            <span style="font-size: 12px; color: var(--c-bg);">已运行 42 天 3 小时</span>
        </div>

        <!-- 2. Account Info Card -->
        <div style="margin: 12px 16px 0; background: var(--c-bg); border-radius: 8px; padding: 16px;">
            <h2 style="font-size: 15px; font-weight: 500; color: var(--c-text-primary); margin: 0 0 12px;">账号信息</h2>

            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">账号</span>
                <span style="font-size: 14px; color: var(--c-text-primary);">win-prod-001</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">产品</span>
                <span style="font-size: 14px; color: var(--c-text-primary);">Windows 10 专业版</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">配置</span>
                <span style="font-size: 14px; color: var(--c-text-primary);">4核 8G / 100G SSD</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">到期</span>
                <span style="font-size: 14px; color: var(--c-text-primary);">2024-12-31</span>
            </div>
        </div>

        <!-- 3. Connection Info Card -->
        <div style="margin: 12px 16px 0; background: var(--c-bg); border-radius: 8px; padding: 16px;">
            <h2 style="font-size: 15px; font-weight: 500; color: var(--c-text-primary); margin: 0 0 12px;">连接信息</h2>

            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">IP 地址</span>
                <span style="font-size: 14px; color: var(--c-text-primary);">192.168.1.100</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">端口</span>
                <span style="font-size: 14px; color: var(--c-text-primary);">3389</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                <span style="font-size: 14px; color: var(--c-text-tertiary);">RDP 地址</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 14px; color: var(--c-text-primary);">192.168.1.100:3389</span>
                    <button style="font-size: 12px; padding: 2px 10px; border: 1px solid var(--c-brand); border-radius: 4px; background: transparent; color: var(--c-brand); cursor: pointer; font-family: inherit; white-space: nowrap;">复制</button>
                </div>
            </div>
        </div>

        <!-- 4. Password Section -->
        <div style="margin: 12px 16px 0; background: var(--c-bg); border-radius: 8px; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="font-size: 15px; font-weight: 500; color: var(--c-text-primary);">初始密码</span>
                <button style="font-size: 12px; padding: 2px 10px; border: 1px solid var(--c-brand); border-radius: 4px; background: transparent; color: var(--c-brand); cursor: pointer; font-family: inherit;">查看</button>
            </div>
            <div style="font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 16px; font-weight: 500; color: var(--c-text-primary); padding: 10px 12px; background: var(--c-bg-secondary); border-radius: 6px; letter-spacing: 0.5px;">
                Xk9$mP2q!z
            </div>
            <p style="font-size: 12px; color: var(--c-warning); margin: 8px 0 0; line-height: 1.4;">此密码仅显示一次，请妥善记录</p>
        </div>

        <!-- 5. Actions Row -->
        <div style="margin: 16px 16px 0; display: flex; gap: 12px;">
            <button style="flex: 1; height: 40px; border: 1px solid var(--c-brand); border-radius: 8px; background: transparent; color: var(--c-brand); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;">重置密码</button>
            <button style="flex: 1; height: 40px; border: none; border-radius: 8px; background: var(--c-brand); color: var(--c-bg); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;">管理</button>
        </div>

    </main>
