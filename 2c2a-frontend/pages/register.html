    <style>:root{--c-brand:#4b3fe3;--c-brand-hover:#6a6fff;--c-brand-active:#3f31c6;--c-brand-disabled:rgba(75,63,227,0.22);--c-brand-soft:rgba(170,183,255,0.36);--c-bg:#ffffff;--c-bg-secondary:#f5f5f5;--c-bg-tertiary:#e5e5e5;--c-text-primary:#171717;--c-text-default:#262626;--c-text-secondary:#404040;--c-text-tertiary:#737373;--c-border:rgba(115,115,115,0.12);--c-success:#00b983;--c-warning:#f2a90c;--c-error:#ff4757;--c-info:#3f85ff}</style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: #ffffff; color: #0f172a; }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background-color: var(--c-bg-secondary); font-family: 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;">
    <main class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-sm" style="background-color: #ffffff; border-radius: 10px; padding: 24px;">
            <!-- Brand -->
            <h1 class="text-center font-semibold" style="font-size: 28px; color: var(--c-brand); line-height: 1.3;">2c2a</h1>
            <p class="text-center mt-1" style="font-size: 14px; color: var(--c-text-secondary);">创建新账户</p>

            <!-- Form -->
            <div class="mt-8 flex flex-col gap-4">
                <input
                    type="text"
                    placeholder="用户名"
                    class="w-full outline-none"
                    style="height: 44px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 8px; font-size: 14px; color: var(--c-text-primary); background: #ffffff;"
                />
                <input
                    type="email"
                    placeholder="邮箱"
                    class="w-full outline-none"
                    style="height: 44px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 8px; font-size: 14px; color: var(--c-text-primary); background: #ffffff;"
                />
                <!-- Email verification code -->
                <div style="display: flex; gap: 8px;">
                    <input
                        type="text"
                        placeholder="邮箱验证码"
                        class="outline-none"
                        style="flex: 1; height: 44px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 8px; font-size: 14px; color: var(--c-text-primary); background: #ffffff; box-sizing: border-box;"
                    />
                    <button
                        type="button"
                        id="btn-send-code"
                        onclick="startCodeCountdown()"
                        style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid var(--c-brand); border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--c-brand); background: transparent; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s;"
                        onmouseenter="if(!this.disabled){this.style.background='var(--c-brand)';this.style.color='var(--c-bg)'}"
                        onmouseleave="if(!this.disabled){this.style.background='transparent';this.style.color='var(--c-brand)'}"
                    >获取验证码</button>
                </div>
                <input
                    type="password"
                    placeholder="密码"
                    class="w-full outline-none"
                    style="height: 44px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 8px; font-size: 14px; color: var(--c-text-primary); background: #ffffff;"
                />
                <input
                    type="password"
                    placeholder="确认密码"
                    class="w-full outline-none"
                    style="height: 44px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 8px; font-size: 14px; color: var(--c-text-primary); background: #ffffff;"
                />

                <!-- Invite token toggle -->
                <div>
                    <button
                        type="button"
                        id="toggle-invite"
                        class="text-left"
                        style="font-size: 12px; color: var(--c-text-tertiary); cursor: pointer; background: none; border: none; padding: 0;"
                        onclick="document.getElementById('invite-section').classList.toggle('hidden'); this.textContent = document.getElementById('invite-section').classList.contains('hidden') ? '邀请码（选填）' : '收起邀请码'"
                    >邀请码（选填）</button>
                    <div id="invite-section" class="hidden mt-2">
                        <input
                            type="text"
                            placeholder="邀请码"
                            class="w-full outline-none"
                            style="height: 44px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 8px; font-size: 14px; color: var(--c-text-primary); background: #ffffff;"
                        />
                    </div>
                </div>

                <!-- Register button -->
                <div class="mt-2">
                    <button
                        type="button"
                        data-dom-id="cta-register"
                        class="w-full font-medium cursor-pointer"
                        style="height: 44px; border: none; border-radius: 8px; font-size: 15px; color: #ffffff; background-color: var(--c-brand);"
                        onmouseenter="this.style.backgroundColor='var(--c-brand-hover)'"
                        onmouseleave="this.style.backgroundColor='var(--c-brand)'"
                    >注册</button>
                </div>

                <!-- Login link -->
                <p class="text-center mt-4" style="font-size: 14px; color: var(--c-text-tertiary);">
                    已有账户？<a href="#" data-dom-id="link-login" style="color: var(--c-brand); text-decoration: none; font-weight: 500;">立即登录</a>
                    <span style="margin: 0 8px; color: var(--c-border);">|</span>
                    <a href="#" data-dom-id="link-forgot" style="color: var(--c-brand); text-decoration: none; font-weight: 500;">忘记密码</a>
                </p>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();
    (function() {
        var btn = document.getElementById('btn-send-code');
        var countdown = 0;
        var interval = null;

        window.startCodeCountdown = function() {
            if (countdown > 0) return;
            countdown = 60;
            btn.disabled = true;
            btn.textContent = countdown + 's';
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
            btn.style.borderColor = 'var(--c-border)';
            btn.style.color = 'var(--c-text-tertiary)';
            interval = setInterval(function() {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    btn.style.borderColor = 'var(--c-brand)';
                    btn.style.color = 'var(--c-brand)';
                } else {
                    btn.textContent = countdown + 's';
                }
            }, 1000);
        };
    })();
    </script>

</body>
</html>
