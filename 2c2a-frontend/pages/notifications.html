<body class="min-h-screen font-sans antialiased" style="background: var(--c-bg-secondary); color: var(--c-text-primary); font-family: 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; overflow-y: auto;">

        <a href="dashboard.html" data-dom-id="back-dashboard" class="flex items-center" style="color: var(--c-text-primary); text-decoration: none; margin-right: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"

            </svg>
        </a>
        <span style="font-size: 17px; font-weight: 600; color: var(--c-text-primary); flex: 1;">站内信</span>
        <a href="#" data-dom-id="btn-mark-all-read" style="font-size: 13px; color: var(--c-brand); text-decoration: none; flex-shrink: 0;">全部已读</a>

    <!-- Main Content -->

                        <span style="font-size: 11px; color: var(--c-text-tertiary); flex-shrink: 0; margin-left: 8px;">3天前</span>

                <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(75,63,227,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">

                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                        <path d="m3.3 7 8.7 5 8.7-5"/>

                    </div>
                    <p style="font-size: 13px; color: var(--c-text-tertiary); margin: 0; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px;">新产品 Ubuntu 24.04 LTS 已上架</p>
