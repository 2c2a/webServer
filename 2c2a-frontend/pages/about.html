        </div>

            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">

            </div>

                <span style="font-size: 14px; color: var(--c-text-primary);">2024.06.01</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border);">

            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">

                <span style="font-size: 14px; color: var(--c-text-primary);">HTMX + Tailwind CSS</span>
            </div>
        </div>

        <!-- 3. Description Card -->
        <div style="margin: 12px 16px 0; background: var(--c-bg); border-radius: 8px; padding: 16px;">
            <h2 style="font-size: 15px; font-weight: 500; color: var(--c-text-primary); margin: 0 0 10px;">关于 2c2a</h2>
            <p style="font-size: 14px; color: var(--c-text-secondary); line-height: 1.6; margin: 0;">2c2a 是一个零代理安全控制架构的云服务平台，提供云电脑管理、工单系统、积分体系等功能模块。系统采用全异步架构，支持多站点隔离和原生插件系统。</p>
        </div>

        <!-- 4. Links Section -->
        <div style="margin: 12px 16px 0; background: var(--c-bg); border-radius: 8px; padding: 16px;">
            <a href="#"
               style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; text-decoration: none; border-bottom: 1px solid var(--c-border);"
