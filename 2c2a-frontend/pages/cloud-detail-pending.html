<body class="min-h-screen font-sans antialiased" style="background: var(--c-bg-secondary); color: var(--c-text-primary); font-family: 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; overflow-y: auto;">

        <span style="width: 32px; display: inline-block;"></span>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="min-h-screen" style="padding-top: 44px; padding-bottom: 120px;">

        <!-- 1. Status Banner -->
        <div style="padding: 12px 16px 0;">

                <div style="display: flex; align-items: center; gap: 8px;">
                    <!-- Spinner/clock icon -->
                    <svg class="spinner-slow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span style="font-size: 15px; font-weight: 500; color: #ffffff;">申请中</span>
                </div>
                <span style="font-size: 12px; color: rgba(255,255,255,0.85);">提交于 2024-06-20 10:30</span>
            </div>
        </div>

        <!-- 2. Application Info Card -->
        <div style="padding: 12px 16px 0;">
            <div style="background: var(--c-bg); border-radius: 8px; padding: 16px;">
                <h2 style="font-size: 16px; font-weight: 600; color: var(--c-text-primary); margin: 0 0 4px;">申请信息</h2>

                <!-- Info Row: 目标产品 -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                    <span style="font-size: 14px; color: var(--c-text-tertiary);">目标产品</span>
                    <span style="font-size: 14px; color: var(--c-text-primary); font-weight: 500;">Ubuntu 22.04 开发版</span>
                </div>

                <!-- Info Row: 磁盘容量 -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                    <span style="font-size: 14px; color: var(--c-text-tertiary);">磁盘容量</span>
                    <span style="font-size: 14px; color: var(--c-text-primary); font-weight: 500;">100G SSD</span>
                </div>

                <!-- Info Row: 所需积分 -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                    <span style="font-size: 14px; color: var(--c-text-tertiary);">所需积分</span>
                    <span style="font-size: 14px; color: var(--c-brand); font-weight: 500;">150 积分/月</span>
                </div>

                <!-- Info Row: 申请时间 -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--c-border);">
                    <span style="font-size: 14px; color: var(--c-text-tertiary);">申请时间</span>
                    <span style="font-size: 14px; color: var(--c-text-primary); font-weight: 500;">2024-06-20 10:30</span>
                </div>

                <!-- Info Row: 申请状态 -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0;">
                    <span style="font-size: 14px; color: var(--c-text-tertiary);">申请状态</span>
                    <span style="font-size: 14px; color: var(--c-warning); font-weight: 500;">审核中</span>
                </div>
            </div>
        </div>

        <!-- 3. Timeline Card -->
        <div style="padding: 12px 16px 0;">
            <div style="background: var(--c-bg); border-radius: 8px; padding: 16px;">
                <h2 style="font-size: 16px; font-weight: 600; color: var(--c-text-primary); margin: 0 0 16px;">审核进度</h2>

                <!-- Timeline -->
                <div style="position: relative; padding-left: 24px;">

                    <!-- Vertical Line (connecting dots) -->
                    <div style="position: absolute; left: 7px; top: 8px; bottom: 24px; width: 2px; background: var(--c-border);"></div>

                    <!-- Timeline Item 1: 提交申请 (completed) -->
                    <div style="position: relative; padding-bottom: 24px;">
                        <!-- Filled green dot -->
                        <div style="position: absolute; left: -24px; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-success); border: 2px solid var(--c-success);"></div>
                        <div>
                            <p style="font-size: 14px; color: var(--c-text-primary); font-weight: 500; margin: 0 0 2px;">提交申请</p>
                            <p style="font-size: 12px; color: var(--c-text-tertiary); margin: 0;">2024-06-20 10:30</p>
                        </div>
                    </div>

                    <!-- Timeline Item 2: 管理员审核中 (in-progress) -->
                    <div style="position: relative; padding-bottom: 24px;">
                        <!-- Pulsing amber dot -->
                        <div class="timeline-dot-pulse" style="position: absolute; left: -24px; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-warning); border: 2px solid var(--c-warning);"></div>
                        <div>
                            <p style="font-size: 14px; color: var(--c-text-primary); font-weight: 500; margin: 0;">管理员审核中</p>
                        </div>
                    </div>

                    <!-- Timeline Item 3: 开通中 (pending) -->
                    <div style="position: relative; padding-bottom: 24px;">
                        <!-- Gray empty dot -->
                        <div style="position: absolute; left: -24px; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-bg); border: 2px solid var(--c-text-tertiary);"></div>
                        <div>
                            <p style="font-size: 14px; color: var(--c-text-tertiary); margin: 0;">开通中</p>
                        </div>
                    </div>

                    <!-- Timeline Item 4: 完成 (pending) -->
                    <div style="position: relative;">
                        <!-- Gray empty dot -->
                        <div style="position: absolute; left: -24px; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-bg); border: 2px solid var(--c-text-tertiary);"></div>
                        <div>
                            <p style="font-size: 14px; color: var(--c-text-tertiary); margin: 0;">完成</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
