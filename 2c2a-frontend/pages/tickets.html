                    style="color: var(--c-text-tertiary); background-color: var(--c-bg-secondary);">已关闭</button>
        </div>

        <!-- Ticket List -->
        <div class="px-4 py-3 flex flex-col gap-3">

            <!-- Ticket 1: 待处理 -->
            <div class="bg-white rounded-lg p-3 flex flex-col gap-2"
                 style="border: 1px solid rgba(115,115,115,0.08);">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs" style="color: var(--c-text-tertiary);">TK-20240601-001</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium text-white"
                          style="background-color: var(--c-warning);">待处理</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                          style="color: var(--c-warning); background-color: rgba(242,169,12,0.12);">中优先级</span>
                </div>
                <p class="text-sm font-medium" style="color: var(--c-text-primary);">无法连接远程桌面</p>
                <span class="text-xs" style="color: var(--c-text-tertiary);">2024-06-01 14:30</span>
            </div>

            <!-- Ticket 2: 处理中 -->
            <div class="bg-white rounded-lg p-3 flex flex-col gap-2"
                 style="border: 1px solid rgba(115,115,115,0.08);">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs" style="color: var(--c-text-tertiary);">TK-20240528-003</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium text-white"
                          style="background-color: var(--c-info);">处理中</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                          style="color: var(--c-error); background-color: rgba(255,71,87,0.12);">高优先级</span>
                </div>
                <p class="text-sm font-medium" style="color: var(--c-text-primary);">磁盘空间不足告警</p>
                <span class="text-xs" style="color: var(--c-text-tertiary);">2024-05-28 09:15</span>
            </div>

            <!-- Ticket 3: 已解决 -->
            <div class="bg-white rounded-lg p-3 flex flex-col gap-2"
                 style="border: 1px solid rgba(115,115,115,0.08);">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs" style="color: var(--c-text-tertiary);">TK-20240520-007</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium text-white"
                          style="background-color: var(--c-success);">已解决</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                          style="color: var(--c-info); background-color: rgba(63,133,255,0.12);">低优先级</span>
                </div>
                <p class="text-sm font-medium" style="color: var(--c-text-primary);">申请增加内存配置</p>
                <span class="text-xs" style="color: var(--c-text-tertiary);">2024-05-20 16:42</span>
            </div>

        </div>

        <!-- Load More Hint -->
        <div class="flex items-center justify-center py-6">
            <span class="text-xs" style="color: var(--c-text-tertiary);">下拉加载更多</span>
        </div>
