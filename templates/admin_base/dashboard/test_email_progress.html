{% extends "admin_base/base.html" %}

{% block title %}{{ site_name }} - 测试邮件发送中{% endblock %}

{% block breadcrumb %}
<a href="{% url 'admin:admin_dashboard_config:systemconfig_edit' %}" class="text-white/70 hover:text-cyan-400 transition">系统配置</a>
<span class="material-symbols-rounded text-sm text-white/50">chevron_right</span>
<span class="text-cyan-400 font-medium">测试邮件</span>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-16"
     x-data="emailProgress()"
     x-init="init()">

    <x-admin-card>
        <div class="text-center py-6">
            <!-- Pending / Running -->
            <template x-if="status === 'pending' || status === 'running'">
                <div>
                    <div class="mb-4">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-500/10">
                            <span class="material-symbols-rounded text-3xl text-cyan-400 animate-spin">progress_activity</span>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">正在发送测试邮件</h2>
                    <p class="text-white/70 text-sm">
                        目标: <span class="text-cyan-400">{{ test_email }}</span>
                    </p>
                    <!-- Progress bar -->
                    <div class="mt-4 mx-auto max-w-xs">
                        <div class="w-full bg-slate-800 rounded-full h-1.5">
                            <div class="bg-cyan-500 h-1.5 rounded-full transition-all duration-500"
                                 :style="`width: ${progress}%`"></div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Success -->
            <template x-if="status === 'success'">
                <div>
                    <div class="mb-4">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-500/10">
                            <span class="material-symbols-rounded text-3xl text-green-400">check_circle</span>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">测试邮件发送成功</h2>
                    <p class="text-white/70 text-sm">
                        已发送至: <span class="text-green-400">{{ test_email }}</span>
                    </p>
                    <div class="mt-6">
                        <a href="{% url 'admin:admin_dashboard_config:systemconfig_edit' %}"
                           class="inline-flex items-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-md font-medium shadow-[0_0_15px_-3px_rgba(34,211,238,0.3)] transition">
                            <span class="material-symbols-rounded text-lg">arrow_back</span>
                            返回系统配置
                        </a>
                    </div>
                </div>
            </template>

            <!-- Failed -->
            <template x-if="status === 'failed'">
                <div>
                    <div class="mb-4">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/10">
                            <span class="material-symbols-rounded text-3xl text-red-400">error</span>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">测试邮件发送失败</h2>
                    <p class="text-red-400 text-sm break-all" x-text="errorMsg"></p>
                    <div class="mt-6">
                        <a href="{% url 'admin:admin_dashboard_config:systemconfig_edit' %}"
                           class="inline-flex items-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-md font-medium shadow-[0_0_15px_-3px_rgba(34,211,238,0.3)] transition">
                            <span class="material-symbols-rounded text-lg">arrow_back</span>
                            返回系统配置
                        </a>
                    </div>
                </div>
            </template>

            <!-- Timeout -->
            <template x-if="status === 'timeout'">
                <div>
                    <div class="mb-4">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-500/10">
                            <span class="material-symbols-rounded text-3xl text-amber-400">timer_off</span>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">等待超时</h2>
                    <p class="text-white/70 text-sm">邮件发送时间过长，请检查 Celery Worker 是否正常运行。</p>
                    <div class="mt-6">
                        <a href="{% url 'admin:admin_dashboard_config:systemconfig_edit' %}"
                           class="inline-flex items-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-md font-medium shadow-[0_0_15px_-3px_rgba(34,211,238,0.3)] transition">
                            <span class="material-symbols-rounded text-lg">arrow_back</span>
                            返回系统配置
                        </a>
                    </div>
                </div>
            </template>
        </div>

        <!-- Debug Log Panel -->
        <div class="border-t border-slate-700/50 px-6 py-4">
            <div class="flex items-center gap-2 mb-3">
                <span class="material-symbols-rounded text-sm text-cyan-400">terminal</span>
                <span class="text-xs font-medium text-white/70 uppercase tracking-wider">调试日志</span>
            </div>
            <div class="bg-slate-950/80 rounded-md p-3 max-h-48 overflow-y-auto font-mono text-xs space-y-0.5"
                 x-ref="logContainer">
                <template x-if="logs.length === 0">
                    <p class="text-white/30">等待任务启动...</p>
                </template>
                <template x-for="(log, index) in logs" :key="index">
                    <p class="text-green-400/80 whitespace-pre-wrap" x-text="log"></p>
                </template>
            </div>
        </div>
    </x-admin-card>
</div>

<script>
function emailProgress() {
    return {
        status: '{{ task_record.status }}',
        progress: {{ task_record.progress|default:0 }},
        errorMsg: '{{ task_record.error_message|default:"" }}',
        logs: [],

        init() {
            if (this.status === 'success' || this.status === 'failed' || this.status === 'cancelled') {
                return;
            }

            const sseUrl = "{% url 'admin:admin_dashboard_config:test_email_sse' task_pk=task_record.pk %}";
            const es = new EventSource(sseUrl);

            es.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    this.status = data.status;
                    this.progress = data.progress || 0;
                    if (data.error) {
                        this.errorMsg = data.error;
                    }
                    if (data.logs) {
                        this.logs = data.logs;
                        this.$nextTick(() => {
                            const el = this.$refs.logContainer;
                            if (el) el.scrollTop = el.scrollHeight;
                        });
                    }
                    if (data.status === 'success' || data.status === 'failed' || data.status === 'cancelled' || data.status === 'timeout') {
                        es.close();
                    }
                } catch (e) {
                    console.error('SSE parse error:', e);
                }
            };

            es.onerror = () => {
                es.close();
                if (this.status !== 'success' && this.status !== 'failed') {
                    this.status = 'timeout';
                }
            };
        }
    };
}
</script>
{% endblock %}
